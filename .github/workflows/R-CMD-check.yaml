# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-24.04,   r: 'devel', http-user-agent: 'release'}
          # the current release on ubuntu runs in the portfolio's CI image
          # (SidneyBissoli/r-ci): R, pandoc and every dependency already
          # there, nothing installed through the apt mirror at job time.
          # devel and oldrel-1 are other R versions and keep setup-r, pinned
          # to ubuntu-24.04: on 26.04 (ubuntu-latest since ~2026-10-26)
          # setup-r apt-installs 175 packages from a slow mirror and stalls
          # past its limit (measured in cvmdata on 2026-10-27).
          - {os: ubuntu-latest,  r: 'release', container: 'ghcr.io/sidneybissoli/r-ci:latest'}
          - {os: ubuntu-24.04,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_DONTTEST_EXAMPLES_: false  # Skip \donttest{} examples (download large files)

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2
        if: ${{ !matrix.config.container }}

      # The setup steps take 20-80 s when the Ubuntu apt mirror of the
      # runners answers; on 2026-10-23 it crawled and they hung for hours
      # (azure.archive.ubuntu.com). Past the deadline the job fails fast
      # and is re-run, instead of holding the PR.
      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        timeout-minutes: 10
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # in the image it only covers a dependency newer than the last build
      # 45 and not 15: on R devel (and on a package whose binary P3M has not
      # built yet) pak compiles from source — duckdb alone took 13 min on
      # 2026-10-24 — and that is work, not a stall
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 45
        with:
          cache: ${{ !matrix.config.container }}
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
