# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    # 24.04, not latest (26.04): setup-r stalls there, see R-CMD-check.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # The setup steps take 20-80 s when the Ubuntu apt mirror of the
      # runners answers; on 2026-10-23 it crawled and they hung for hours
      # (azure.archive.ubuntu.com). Past the deadline the job fails fast
      # and is re-run, instead of holding the PR.
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
